# Replaces the image's own datasource file (same uids), adding the links between
# logs and traces. "$$" is a literal "$" (Grafana expands $VAR in these files).
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    url: http://127.0.0.1:3100
    editable: false
    isDefault: true
    jsonData:
      maxLines: 1000
      # Log -> trace: every exported record carries trace_id as structured metadata.
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: "Abrir o trace"

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://127.0.0.1:3200
    editable: false
    jsonData:
      # Trace -> logs: the logs of every service written inside this trace.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{service_name=~"agent|ocr-mcp|rag-mcp|scheduler-api"} | trace_id="$${__trace.traceId}"'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki

  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://127.0.0.1:9090
    editable: false
    jsonData:
      timeInterval: 60s
