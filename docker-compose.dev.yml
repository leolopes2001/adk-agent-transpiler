# Debugging only: publishes the MCP servers on the loopback interface.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait
# Publishing needs a non-internal network, so here the servers also join `edge`
# and lose the isolation of the default setup. Not used by the standard flow.

services:
  ocr-mcp:
    ports: ["127.0.0.1:8101:8101"]
    networks: [backend, edge]

  rag-mcp:
    ports: ["127.0.0.1:8102:8102"]
    networks: [backend, edge]
