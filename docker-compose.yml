# Full stack: Postgres, scheduler API, OCR and RAG MCP servers, plus the agent CLI.
#
#   docker compose up -d --build --wait
#   docker compose run --rm transpile          # spec -> generated code (named volume)
#   docker compose run --rm export-generated   # copy it to ./generated on the host
#   docker compose run --rm agent run --image /app/inputs/samples/pedido_medico_ficticio.png
#   docker compose --profile "*" down -v      # also removes the agent/tool network and volume
#
# Optional logs and traces in Grafana (http://localhost:3000), see README:
#   docker compose --profile observability up -d --build --wait
#
# Networks: `backend` is internal (no internet) and holds every service; only the
# agent also joins `egress` to reach Gemini, and only the API joins `edge`, which
# exists to publish its port (a port cannot be published from an internal network).
# Each service gets only the secrets it uses.
#
# Every service is given the collector's OTLP endpoint (OTEL_EXPORTER_OTLP_ENDPOINT)
# but exports only if the collector answers there when the process starts: without
# the `observability` profile the name does not resolve on `backend`, so nothing is
# exported and nothing waits for it. The servers start after the collector when the
# profile is on (an optional dependency, ignored when it is off).

name: lab-agent

# Every project container: read-only root filesystem (writable /tmp in memory),
# no Linux capabilities and no privilege gain through setuid binaries.
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-otlp-endpoint: &otlp-endpoint http://observability:4318

# The servers start after the collector, when the `observability` profile is on.
x-after-collector: &after-collector
  condition: service_healthy
  required: false

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    # The official image starts as root to fix the data directory's ownership,
    # then drops to the postgres user: it needs these capabilities and a
    # writable socket directory, nothing else.
    read_only: true
    tmpfs: ["/tmp:size=64m", "/var/run/postgresql:size=1m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler-api:
    <<: *hardening
    build: { context: ., dockerfile: docker/scheduler-api.Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://scheduler:${POSTGRES_PASSWORD}@postgres:5432/scheduler
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:?set SCHEDULER_API_KEY in .env}
      CATALOG_PATH: /app/data/exams_catalog.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint
    volumes:
      - ./data:/app/data:ro
    # Loopback only: Swagger at http://localhost:8000/docs, not reachable from the network.
    ports: ["127.0.0.1:8000:8000"]
    networks: [backend, edge]
    depends_on:
      postgres: { condition: service_healthy }
      observability: *after-collector
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20

  ocr-mcp:
    <<: *hardening
    build: { context: ., dockerfile: docker/ocr-mcp.Dockerfile }
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      PII_HMAC_SECRET: ${PII_HMAC_SECRET:?set PII_HMAC_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint
    networks: [backend]
    depends_on:
      observability: *after-collector
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8101/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20

  rag-mcp:
    <<: *hardening
    build: { context: ., dockerfile: docker/rag-mcp.Dockerfile }
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      CATALOG_PATH: /app/data/exams_catalog.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint
    volumes:
      - ./data:/app/data:ro
    networks: [backend]
    depends_on:
      observability: *after-collector
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8102/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional (profile `observability`): Grafana with Loki (logs), Tempo (traces) and
  # an OpenTelemetry collector in one container, for local demos only. Data lives in
  # memory and is lost when the container stops. Grafana is published on the loopback
  # interface only and opens without a login as a read-only Viewer (Explore included);
  # the login form and basic auth are off, so no account can sign in at all.
  # No internet access: `edge` has no IP masquerading.
  observability:
    <<: *hardening
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    profiles: [observability]
    # The image starts as root but needs no privilege: every component writes
    # only to /data, /tmp and /var/tempo, all in memory.
    user: "10001:10001"
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001
      - /data:size=1g,uid=10001,gid=10001
      - /var/tempo:size=64m,uid=10001,gid=10001
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # Lets a Viewer open Explore (log -> trace links); dashboards stay read-only.
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/lab-dashboards/lab-exam-agent.json
    # Everything Grafana shows is versioned in observability/grafana: the datasources
    # (replacing the image's, with the log <-> trace links) and the dashboard.
    volumes:
      - ./observability/grafana/provisioning/datasources/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ./observability/grafana/provisioning/dashboards/lab-exam-agent.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/lab-exam-agent.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/lab-dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [backend, edge]
    deploy:
      resources:
        limits: { memory: 3g }
    healthcheck:
      # run-all.sh writes it once Grafana, Loki, Tempo and the collector are ready.
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # A CLI, not a long-running service: `docker compose run --rm agent ...`.
  # The `cli` profile keeps it out of `docker compose up`.
  agent:
    <<: *hardening
    image: lab-agent-agent
    build: { context: ., dockerfile: docker/agent.Dockerfile }
    profiles: [cli]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # No LOG_LEVEL: the CLI logs only errors unless run with --verbose
      # (or `-e LOG_LEVEL=INFO`); the LOG_LEVEL in .env is for the services.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENT_LLM_BACKEND: ${AGENT_LLM_BACKEND:-gemini}
      OCR_MCP_URL: http://ocr-mcp:8101/sse
      RAG_MCP_URL: http://rag-mcp:8102/sse
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      SCHEDULER_API_URL: http://scheduler-api:8000
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:?set SCHEDULER_API_KEY in .env}
      INPUT_ROOT: /app/inputs
      GENERATED_ROOT: /app/generated
      OTEL_EXPORTER_OTLP_ENDPOINT: *otlp-endpoint
    volumes:
      - ./specs:/app/specs:ro
      - ./samples:/app/inputs/samples:ro
      # A named volume, not ./generated: on a Linux host a bind-mounted directory
      # belongs to the host user (or to root, when Docker creates it), and UID
      # 10001 could not write the generated code. `export-generated` copies it out.
      - generated:/app/generated
    networks: [backend, egress]
    depends_on:
      scheduler-api: { condition: service_healthy }
      ocr-mcp: { condition: service_healthy }
      rag-mcp: { condition: service_healthy }
    # Human review asks on the terminal.
    stdin_open: true
    tty: true

  # Tools (profile `tools`), same image as the agent, no network.
  #   docker compose run --rm transpile [/app/specs/<spec>.json]
  transpile:
    <<: *hardening
    image: lab-agent-agent
    build: { context: ., dockerfile: docker/agent.Dockerfile }
    profiles: [tools]
    network_mode: none
    entrypoint: [lab-transpile, generate, --out, /app/generated]
    command: [/app/specs/exam_scheduling_agent.json]
    volumes:
      - ./specs:/app/specs:ro
      - generated:/app/generated

  # Copies the generated packages from the volume to ./generated on the host:
  #   docker compose run --rm export-generated
  # The only container that runs as root: ./generated belongs to the host user (or
  # to root, when Docker creates it), so the copy is written and then handed to the
  # owner of ./specs, the user who cloned the repository. Changing file ownership
  # and bypassing file permissions is all it can do; it has no network.
  export-generated:
    <<: *hardening
    image: lab-agent-agent
    build: { context: ., dockerfile: docker/agent.Dockerfile }
    profiles: [tools]
    network_mode: none
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    volumes:
      - ./specs:/app/specs:ro
      - generated:/app/generated:ro
      - ./generated:/export
    entrypoint:
      - sh
      - -euc
      - |
        owner=$$(stat -c %u:%g /app/specs)
        exported=0
        for dir in /app/generated/*/; do
          [ -d "$$dir" ] || continue
          name=$$(basename "$$dir")
          rm -rf "/export/$$name"
          cp -R "$${dir%/}" "/export/$$name"
          # Docker Desktop (macOS, Windows) maps ownership itself and may refuse chown.
          chown -R "$$owner" "/export/$$name" 2>/dev/null || true
          echo "exported generated/$$name"
          exported=$$((exported + 1))
        done
        chown "$$owner" /export 2>/dev/null || true
        if [ "$$exported" -eq 0 ]; then
          echo "nothing to export: run 'docker compose run --rm transpile' first" >&2
          exit 1
        fi

networks:
  backend:
    internal: true
  egress: {}
  # Only for publishing the API port: without IP masquerading, inbound connections
  # to the published port work but containers get no outbound internet access.
  edge:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  pgdata: {}
  generated: {}
