name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Import contracts
        run: uv run lint-imports

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Unit and contract tests
        run: uv run pytest -m "unit or contract" --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration-security:
    needs: [quality, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Phase 04 (OCR) needs Tesseract with Portuguese data; set to "true" then.
      INSTALL_TESSERACT: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Install Tesseract
        if: env.INSTALL_TESSERACT == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por
          tesseract --version
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev
      # Testcontainers starts Postgres through the runner's Docker daemon.
      - name: Check Docker
        run: docker info --format '{{.ServerVersion}}'
      - name: Integration and security tests
        run: >-
          uv run pytest -m "integration or security"
          --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-xml
          path: coverage.xml
          if-no-files-found: ignore
